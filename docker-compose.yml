services:

  mysql:
    image: mysql:5.7
    container_name: mysql_jasperserver
    environment:
      MYSQL_ROOT_PASSWORD: "oGMVO45fBOSLdosB"
      MYSQL_DATABASE: jasperserver
    volumes:
      - ./datadir:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p oGMVO45fBOSLdosB"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  jasperserver:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        JS_VERSION: 8.2.0
    container_name: jasperserver
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    environment:
      DB_TYPE: mysql
      DB_HOST: mysql_jasperserver
      DB_PORT: 3306
      DB_NAME: jasperserver
      DB_USER: root
      DB_PASSWORD: "oGMVO45fBOSLdosB"
      TZ: America/New_York
    volumes:
      - ./jasperserver-import:/jasperserver-import
      - jasperserver-keystore:/root  # Persist keystore files (.jrsks, .jrsksp) to prevent password encryption mismatch
    networks:
      - default
    restart: unless-stopped

volumes:
  jasperserver-keystore:

